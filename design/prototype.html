<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GeneCollision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: navy rail + light workspace. Review = inputs left, assessment right. Explorer = same grid, dashed indigo for anything experimental. */
:root{
  --navy-950:#071427; --navy-900:#0B1F3A; --navy-800:#12294A; --navy-700:#1D3B66; --navy-300:#9FB3CC; --navy-200:#C4D2E3;
  --ink:#0B1F3A; --ink-2:#34485F; --ink-3:#5C6E85;
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#F7F9FC; --line:#DCE4EE; --line-2:#E9EEF4;
  --teal-900:#0A4F52; --teal-700:#0B6F72; --teal-600:#0E8588; --teal-500:#13A1A3; --teal-300:#5FD3D0; --teal-100:#CFEDEC; --teal-50:#EAF6F6;
  --amber-800:#7A4306; --amber-600:#B45F06; --amber-200:#EFD39A; --amber-100:#FBEBC6; --amber-50:#FFF7E6;
  --exp-800:#3F3590; --exp-600:#5B4DBB; --exp-300:#B7AEE6; --exp-200:#D5CFF1; --exp-50:#F4F2FD;
  --crit-700:#A61E14; --crit-200:#F5C2BD; --crit-50:#FEF2F1;
  --slate-100:#E9EEF7; --slate-200:#DDE5F0; --slate-300:#C9D4E3;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(11,31,58,.05); --sh-2:0 1px 2px rgba(11,31,58,.04),0 10px 28px rgba(11,31,58,.06);
  --f-display:'Manrope',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --atom-n:#2F4FBF; --atom-o:#B83227; --atom-f:#0E8588;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:var(--teal-700)}
:focus-visible{outline:2px solid var(--teal-500);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.skel{animation:none!important}}
.mono{font-family:var(--f-mono)}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.fine{font-size:12.5px;color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--navy-900);color:var(--navy-200);display:flex;flex-direction:column;gap:26px;padding:20px 16px 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px;color:#fff}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.015em}
.brand-name b{color:var(--teal-300);font-weight:800}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--navy-200);text-align:left;font-weight:500}
.nav-i:hover:not(:disabled){background:rgba(255,255,255,.06);color:#fff}
.nav-i[aria-current=page]{background:rgba(19,161,163,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(95,211,208,.3)}
.nav-i:disabled{opacity:.6;cursor:not-allowed}
.nav-tag{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.tag-exp{background:rgba(183,174,230,.16);color:var(--exp-200);border:1px dashed rgba(183,174,230,.65)}
.tag-soon{background:rgba(255,255,255,.08);color:var(--navy-300)}
.key{margin-top:auto;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;font-size:12px;color:var(--navy-300);display:flex;flex-direction:column;gap:12px}
.key h4{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--navy-200)}
.key-r{display:flex;gap:10px;align-items:flex-start}
.sw{flex:none;width:16px;height:16px;border-radius:5px;margin-top:2px}
.sw-clin{background:var(--teal-500)}
.sw-exp{border:1.5px dashed var(--exp-300);background:rgba(183,174,230,.16)}
.key-r b{display:block;color:#fff;font-weight:600}
.main{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13px;min-width:0}
.crumbs b{color:var(--ink);font-weight:600}
.tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy-900);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:12px}
.content{max-width:1380px;margin:0 auto;padding:24px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-t{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.page-sub{color:var(--ink-2);margin-top:4px;max-width:62ch}
.foot{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start;padding-top:4px}

/* ---------- primitives ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.4;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip-teal{background:var(--teal-50);border-color:var(--teal-100);color:var(--teal-700)}
.chip-amber{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-800)}
.chip-navy{background:var(--slate-100);border-color:var(--slate-200);color:var(--navy-700)}
.chip-exp{background:var(--exp-50);border:1px dashed var(--exp-300);color:var(--exp-800)}
.chip-miss{background:transparent;border:1px dashed #AEBBCD;color:var(--ink-3)}
.chip-crit{background:var(--crit-50);border-color:var(--crit-200);color:var(--crit-700)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;line-height:1.2}
.btn:hover:not(:disabled){border-color:#B9C7D8;background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--navy-800);border-color:var(--navy-800)}
.btn-exp{background:var(--exp-600);border-color:var(--exp-600);color:#fff}
.btn-exp:hover:not(:disabled){background:var(--exp-800);border-color:var(--exp-800)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn-block{width:100%;padding:13px 16px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-t{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.005em}
.card-s{font-size:12.5px;color:var(--ink-3)}
.card-b{padding:16px}
.grow{flex:1;min-width:0}
.step{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy-900);color:#fff;font-size:12px;font-weight:700;font-family:var(--f-display)}
.step-exp{background:var(--exp-600)}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:13.5px;flex-wrap:wrap}
.banner-amber{background:var(--amber-50);border:1px solid var(--amber-200);color:var(--amber-800)}
.banner-slate{background:var(--slate-100);border:1px solid var(--slate-200);color:var(--navy-700)}
.ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ul li{display:flex;gap:10px;font-size:13.5px;color:var(--ink-2)}
.ul .ic{margin-top:3px;color:var(--ink-3)}

/* ---------- scenarios ---------- */
.scen{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scen-l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.scen-b{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;font-weight:500}
.scen-b:hover{border-color:#B9C7D8;background:var(--surface-2)}
.scen-b[aria-pressed=true]{border-color:var(--navy-900);box-shadow:inset 0 0 0 1px var(--navy-900)}

/* ---------- review layout ---------- */
.review{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.pts{display:flex;flex-direction:column;gap:8px;padding:12px}
.pt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pt:hover{border-color:#B9C7D8}
.pt[aria-checked=true]{border-color:var(--teal-600);background:var(--teal-50);box-shadow:inset 0 0 0 1px var(--teal-600)}
.pt-av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--slate-100);color:var(--navy-700);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.pt[aria-checked=true] .pt-av{background:var(--teal-600);color:#fff}
.pt-n{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pt-n small{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);font-weight:400}
.pt-s{font-size:12.5px;color:var(--ink-3)}
.gene-hero{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px;margin:12px 12px 0}
.gh-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gh-g{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.gh-d{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dip{font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:-.02em}
.act{display:flex;flex-direction:column;gap:6px}
.act-track{position:relative;display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--slate-200)}
.act-z{height:100%}
.az-im{width:41.67%;background:var(--amber-100)}
.az-nm{width:33.33%;background:var(--teal-100)}
.az-um{width:25%;background:var(--slate-200)}
.act-wrap{position:relative}
.act-mark{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--navy-900);transform:translateX(-2px);box-shadow:0 0 0 2px var(--surface-2)}
.act-lbl{display:flex;font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--ink-3)}
.act-lbl span{text-align:center}
.genes{padding:8px 12px 4px;display:flex;flex-direction:column}
.gene-row{display:grid;grid-template-columns:72px 64px minmax(0,1fr);align-items:center;gap:8px;padding:10px 4px;border-top:1px solid var(--line-2)}
.gene-row:first-child{border-top:0}
.gene-row b{font-family:var(--f-display);font-weight:700}
.gene-row .mono{font-size:13px}
.flagbox{margin:12px 12px 0;display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--amber-50);border:1px solid var(--amber-200);color:var(--amber-800);font-size:13px}
.card-f{padding:10px 16px 14px}
.combo{position:relative;padding:12px 12px 0}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-3)}
.search:focus-within{border-color:var(--teal-600);box-shadow:0 0 0 3px rgba(19,161,163,.18)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}
.menu{position:absolute;left:12px;right:12px;top:calc(100% + 4px);z-index:8;list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-2);max-height:300px;overflow:auto}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.opt.hi{background:var(--teal-50)}
.opt strong{display:block;font-weight:600}
.opt span{display:block;font-size:12px;color:var(--ink-3)}
.opt em{font-style:normal;font-size:11.5px;color:var(--ink-2);background:var(--slate-100);padding:2px 8px;border-radius:999px;text-align:right}
.opt.none{cursor:default;color:var(--ink-3)}
.meds{display:flex;flex-direction:column;gap:8px;padding:12px}
.med{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.med .ic.pill{color:var(--teal-700)}
.med-n{font-weight:600}
.med-s{font-size:12px;color:var(--ink-3)}
.x{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--ink-3)}
.x:hover{background:var(--slate-100);color:var(--ink)}
.runbar{position:sticky;bottom:16px;display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-2);backdrop-filter:blur(6px)}

/* ---------- results ---------- */
.results{display:flex;flex-direction:column;gap:16px}
.is-stale .verdict,.is-stale .stale-fade{opacity:.55}
.verdict{border-radius:var(--r-lg);border:1px solid;padding:22px;display:flex;flex-direction:column;gap:18px}
.v-found{background:var(--amber-50);border-color:var(--amber-200)}
.v-none{background:#EEF2F7;border-color:var(--slate-300)}
.v-amb{background:var(--surface);border:1.5px dashed #9FB0C6}
.v-top{display:flex;gap:16px;align-items:flex-start}
.v-ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.v-found .v-ic{background:var(--amber-100);color:var(--amber-800)}
.v-none .v-ic,.v-amb .v-ic{background:var(--slate-200);color:var(--navy-700)}
.v-title{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.12;letter-spacing:-.02em;margin:6px 0 8px;text-wrap:balance}
.v-sum{max-width:64ch;font-size:15px;color:var(--ink-2)}
.notsafe{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--slate-300);font-size:13.5px}
.notsafe .ic{color:var(--navy-700);margin-top:2px}
.v-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 20px;margin:0;padding-top:16px;border-top:1px solid rgba(11,31,58,.1)}
.v-meta dt{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.v-meta dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.v-meta dd small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.flow{display:flex;align-items:stretch;gap:0}
.fnode{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.fnode .eyebrow{font-size:10.5px}
.fn-t{font-weight:600;line-height:1.3}
.fn-s{font-size:12.5px;color:var(--ink-3)}
.fk-gene{background:var(--teal-50);border-color:var(--teal-100)}
.fk-inhib{background:var(--slate-100);border-color:var(--slate-200)}
.fk-effect{background:var(--amber-50);border-color:var(--amber-200)}
.fk-unk{background:var(--surface);border:1.5px dashed #9FB0C6}
.fk-miss{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px);border:1.5px dashed #9FB0C6}
.fconn{flex:none;display:grid;place-items:center;width:26px;color:var(--ink-3)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.checks li:first-child{border-top:0}
.checks .ic{color:var(--ink-3)}
.checks strong{display:block;font-weight:600}
.checks span.n{display:block;font-size:12.5px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.ev{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.ev:first-child{border-top:0;padding-top:0}
.ev-src{flex:none;align-self:flex-start;padding:3px 8px;border-radius:7px;background:var(--navy-900);color:#fff;font-size:11px;font-weight:600;letter-spacing:.04em}
.ev-t{font-weight:600;line-height:1.35}
.ev-c{font-size:12.5px;color:var(--ink-3)}
.ev a{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;margin-top:2px}
.sub-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.sub-h + .ul + .sub-h{margin-top:18px}
.ul + .sub-h{margin-top:18px}

/* idle / loading / error */
.outs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.out{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.out h3{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.3}
.out p{font-size:13px;color:var(--ink-2)}
.out-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.o-found{background:var(--amber-50);border-color:var(--amber-200)}
.o-found .out-ic{background:var(--amber-100);color:var(--amber-800)}
.o-none .out-ic,.o-amb .out-ic{background:var(--slate-200);color:var(--navy-700)}
.o-amb{border:1.5px dashed #9FB0C6}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--ink-3)}
.steps li.on{color:var(--ink);font-weight:500}
.steps li.done{color:var(--ink-2)}
.steps .ic.ok{color:var(--teal-600)}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--line-2),#F6F8FB,var(--line-2));background-size:200% 100%;animation:sh 1.5s linear infinite}
.err{display:flex;gap:16px;padding:22px;border-radius:var(--r-lg);background:var(--crit-50);border:1px solid var(--crit-200)}
.err h2{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--crit-700)}
.err p{color:var(--ink-2);margin-top:6px;max-width:60ch}

function buildPEA(nMe,sub){
  const atoms=[],bonds=[];
  const add=(x,y,el,lab)=>{atoms.push({x,y,el:el||'C',lab});return atoms.length-1};
  const bd=(a,b,o,c)=>bonds.push({a,b,o:o||1,c});
  const ringAt=(cx,cy)=>{const P=[[0,-30],[26,-15],[26,15],[0,30],[-26,15],[-26,-15]];const ix=P.map(p=>add(cx+p[0],cy+p[1]));ix.forEach((v,i)=>bd(v,ix[(i+1)%6],i%2===0?2:1,[cx,cy]));return ix};
  const n=add(26,75,'N',nMe?'NH':'NH₂');
  if(nMe){const me=add(0,60);bd(me,n)}
  const c1=add(52,60),c2=add(78,75),c3=add(104,60);
  bd(n,c1);bd(c1,c2);bd(c2,c3);
  const ra=ringAt(104,0);bd(c3,ra[3]);
  const o=add(130,75,'O','O');bd(c3,o);
  const rb=ringAt(182,75);bd(o,rb[5]);
  if(sub==='cf3'){const c=add(234,105);bd(rb[2],c);[[260,90],[260,120],[234,135]].forEach(p=>{const f=add(p[0],p[1],'F','F');bd(c,f)})}
  if(sub==='me'){const m=add(182,15);bd(rb[0],m)}
  if(sub==='ome'){const oo=add(182,15,'O','O');bd(rb[0],oo);const m=add(208,0);bd(oo,m)}
  return {atoms,bonds};
}
function buildMetformin(){
  const atoms=[],bonds=[];
  const add=(x,y,el,lab)=>{atoms.push({x,y,el:el||'C',lab});return atoms.length-1};
  const bd=(a,b,o)=>bonds.push({a,b,o:o||1});
  const n1=add(60,60,'N','N'),m1=add(34,45),m2=add(34,75);
  const c2=add(86,45),i2=add(86,15,'N','NH'),n2=add(112,60,'N','NH');
  const c3=add(138,45),i3=add(138,15,'N','NH'),n3=add(164,60,'N','NH₂');
  bd(n1,m1);bd(n1,m2);bd(n1,c2);bd(c2,i2,2);bd(c2,n2);bd(n2,c3);bd(c3,i3,2);bd(c3,n3);
  return {atoms,bonds};
}

function validateSmiles(s){
  if(!s)return 'Enter a SMILES string to analyse.';
  for(let i=0;i<s.length;i++){if(!/[A-Za-z0-9@+\-\[\]\(\)=#$:\/\\%.*]/.test(s[i]))return 'Unrecognised character "'+s[i]+'" at position '+(i+1)+'.'}
  if(!/[A-Za-z]/.test(s))return 'No atoms found in this string.';
  let d=0;for(const ch of s){if(ch==='(')d++;if(ch===')'){d--;if(d<0)return 'Unbalanced parentheses: a closing parenthesis has no opening partner.'}}
  if(d>0)return 'Unbalanced parentheses: '+d+' opening parenthesis'+(d>1?'es are':' is')+' never closed.';
  let b=0;for(const ch of s){if(ch==='[')b++;if(ch===']')b--}
  if(b!==0)return 'Unbalanced square brackets in an atom specification.';
  return null;
}
function explore(raw){
  const s=raw.replace(/\s+/g,'');
  const err=validateSmiles(s);
  if(err)return {error:err};
  const id=Object.keys(LIB).find(k=>LIB[k].smiles===s);
  const q=id?LIB[id]:null;
  const base=id||'fluoxetine';
  const neighbours=Object.keys(LIB).filter(k=>k!==base&&k!=='metformin').map(k=>({id:k,...LIB[k],score:simOf(base,k)})).filter(n=>n.score>=.3).sort((a,b)=>b.score-a.score).slice(0,5);
  const sampleOnly=!id;
  const pr=id?PRED[id]:{s:.58,n:.41};
  const dom=pr.n>=.5?'in':pr.n>=.3?'low':'out';
  return {id,smiles:s,name:q?q.name:'Custom structure',formula:q?q.formula:'Computed by RDKit',mw:q?q.mw:'Computed by RDKit',neighbours:id==='metformin'?[]:neighbours,maxSim:id==='metformin'?.09:(neighbours[0]?neighbours[0].score:0),score:pr.s,nearest:pr.n,domain:dom,sampleOnly};
}

function Structure({mol,bg='#fff',label='Molecular structure'}){
  const A=mol.atoms,pad=26;
  const xs=A.map(a=>a.x),ys=A.map(a=>a.y);
  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  const col={N:'var(--atom-n)',O:'var(--atom-o)',F:'var(--atom-f)'};
  const bondEls=mol.bonds.map((b,i)=>{
    const p=A[b.a],q=A[b.b],dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
    const ln=(x1_,y1_,x2_,y2_,k)=>html`<line key=${k} x1=${x1_} y1=${y1_} x2=${x2_} y2=${y2_}/>`;
    if(b.o===2&&b.c){
      const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;let sx=b.c[0]-mx,sy=b.c[1]-my;const sl=Math.hypot(sx,sy);sx/=sl;sy/=sl;
      const off=5,sh=5;
      return html`<g key=${i}>${ln(p.x,p.y,q.x,q.y,'a')}${ln(p.x+ux*sh+sx*off,p.y+uy*sh+sy*off,q.x-ux*sh+sx*off,q.y-uy*sh+sy*off,'b')}</g>`;
    }
    if(b.o===2){const o=2.7;return html`<g key=${i}>${ln(p.x+nx*o,p.y+ny*o,q.x+nx*o,q.y+ny*o,'a')}${ln(p.x-nx*o,p.y-ny*o,q.x-nx*o,q.y-ny*o,'b')}</g>`}
    return ln(p.x,p.y,q.x,q.y,i);
  });
  const labels=A.map((a,i)=>a.lab?html`<g key=${'l'+i}><rect x=${a.x-(a.lab.length*5.2+4)} y=${a.y-10} width=${a.lab.length*10.4+8} height="20" rx="6" fill=${bg}/><text x=${a.x} y=${a.y} textAnchor="middle" dominantBaseline="central" style=${{fill:col[a.el]||'var(--ink)',fontSize:'15px',fontWeight:600,fontFamily:'var(--f-body)'}}>${a.lab}</text></g>`:null);
  return html`<svg viewBox=${x0+' '+y0+' '+(x1-x0)+' '+(y1-y0)} preserveAspectRatio="xMidYMid meet" role="img" aria-label=${label}><g style=${{stroke:'var(--ink)',strokeWidth:2,strokeLinecap:'round',fill:'none'}}>${bondEls}</g>${labels}</svg>`;
}

const SCEN=[
  {id:'SYN-1042',icon:'triangle',text:'Association found'},
  {id:'SYN-2217',icon:'search',text:'No documented association'},

function ReviewView({goExplorer}){
  const [pid,setPid]=useState('SYN-1042');
  const [meds,setMeds]=useState(PATIENTS[0].defaultMeds);
  const [status,setStatus]=useState('idle');
  const [step,setStep]=useState(0);
  const [result,setResult]=useState(null);
  const timers=useRef([]);
  const clear=()=>{timers.current.forEach(clearTimeout);timers.current=[]};
  const run=(patientId,medIds,fail)=>{
    clear();setStatus('loading');setStep(0);
    const t=(fn,ms)=>timers.current.push(setTimeout(fn,ms));
    t(()=>setStep(1),350);t(()=>setStep(2),700);t(()=>setStep(3),1050);
    t(()=>{
      if(fail){setStatus('error');return}
      const p=PATIENTS.find(x=>x.id===patientId);
      setResult({...evaluate(p,medIds),patientId,key:patientId+'|'+medIds.join(',')});
      setStatus('done');
    },1400);
  };
  useEffect(()=>{run(pid,meds,false);return clear},[]);
  const patient=PATIENTS.find(p=>p.id===pid);
  const key=pid+'|'+meds.join(',');
  const stale=status==='done'&&result&&result.key!==key;
  const pick=id=>{const p=PATIENTS.find(x=>x.id===id);clear();setPid(id);setMeds(p.defaultMeds);setStatus('idle');setResult(null)};
  const scenario=id=>{const p=PATIENTS.find(x=>x.id===id);setPid(id);setMeds(p.defaultMeds);run(id,p.defaultMeds,false)};
  const flag=status==='done'&&result&&!stale?result.flag:null;
  let pane;
  if(status==='idle')pane=html`<${Idle}/>`;
  else if(status==='loading')pane=html`<${Loading} step=${step}/>`;
  else if(status==='error')pane=html`<${ErrorPane} onRetry=${()=>run(pid,meds,false)}/>`;
  else pane=html`<${Results} r=${result} stale=${stale} onRerun=${()=>run(pid,meds,false)}/>`;
  return html`<div className="content">
    <div className="page-h">
      <div><h1 className="page-t">Medication review</h1><p className="page-sub">Check a synthetic patient’s medications against evidence-supported pharmacogenetic gene–drug–drug associations.</p></div>
    </div>
    <div className="scen" role="group" aria-label="Demo scenarios">
      <span className="scen-l">Demo scenarios</span>
      ${SCEN.map(s=>html`<button key=${s.id} className="scen-b" aria-pressed=${pid===s.id&&status!=='idle'} onClick=${()=>scenario(s.id)}><${Icon} name=${s.icon} size=${15}/>${s.text}</button>`)}
      <button className="scen-b" onClick=${()=>run(pid,meds,true)}><${Icon} name="alert" size=${15}/>Simulate engine error</button>
    </div>
    <div className="review">
      <div className="col">
        <${PatientCard} pid=${pid} onPick=${pick}/>
        <${GeneticsCard} patient=${patient} flag=${flag}/>
        <${MedsCard} meds=${meds} onAdd=${id=>setMeds(m=>[...m,id])} onRemove=${id=>setMeds(m=>m.filter(x=>x!==id))}/>
        <div className="runbar">
          <button className="btn btn-primary btn-block" disabled=${meds.length<2||status==='loading'} onClick=${()=>run(pid,meds,false)}>${status==='loading'?html`<${Icon} name="loader" size=${16} spin=${true}/>`:html`<${Icon} name="play" size=${16}/>`}${status==='loading'?'Running…':'Run assessment'}</button>
          <div className="fine" style=${{textAlign:'center'}}>${meds.length<2?'Add at least two medications to run.':'Deterministic rules only. No machine learning is used.'}</div>
        </div>
      </div>
      <div className="col">
        ${pane}
        <div className="xlink"><${Icon} name="flask" size=${22}/><div className="grow"><b>Molecular explorer · experimental</b><span>Compare molecular structures. Separate from this assessment and never used in the verdict.</span></div><button className="btn btn-sm" onClick=${goExplorer}>Open explorer<${Icon} name="arrow" size=${14}/></button></div>
        <${PKPanel}/>
      </div>
    </div>
    <${Footer}/>
  </div>`;
}

            ${status==='error'&&html`<div className="field-err" role="alert"><${Icon} name="alert" size=${16}/><span>${err}</span></div>`}
            <div style=${{display:'flex',gap:8}}>
              <button className="btn btn-exp grow" onClick=${()=>analyse(text)} disabled=${status==='loading'}>${status==='loading'?html`<${Icon} name="loader" size=${16} spin=${true}/>`:html`<${Icon} name="search" size=${16}/>`}${status==='loading'?'Analysing…':'Validate and search'}</button>
              <button className="btn" onClick=${()=>{clearTimeout(t.current);setText('');setRes(null);setErr('');setStatus('idle')}}>Clear</button>
            </div>
            <div><div className="eyebrow" style=${{marginBottom:6}}>Examples</div><div className="presets">
              <button className="preset" onClick=${()=>preset(LIB.fluoxetine.smiles)}>Fluoxetine</button>
              <button className="preset" onClick=${()=>preset(LIB.atomoxetine.smiles)}>Atomoxetine</button>
              <button className="preset" onClick=${()=>preset(LIB.metformin.smiles)}>Metformin</button>
              <button className="preset" onClick=${()=>preset('CNCCC(c1ccccc1')}>Invalid example</button></div></div>
          </div>
        </section>
        <section className="card" aria-labelledby="h-q">
          <div className="card-h"><h2 className="card-t grow" id="h-q">Query structure</h2><span className="chip">2D depiction</span></div>
          <div className="card-b" style=${{display:'flex',flexDirection:'column',gap:14}}>
            <div className="struct">${valid&&res&&q?html`<${Structure} mol=${q.mol} label=${q.name+' structure'}/>`:valid&&res?html`<div className="ph"><${Icon} name="hex" size=${34}/>Structure preview renders here from the backend</div>`:html`<div className="ph"><${Icon} name="hex" size=${34}/>${status==='error'?'No structure to draw':'Enter a SMILES string'}</div>`}</div>
            ${valid&&res&&html`<dl className="props"><dt>Name</dt><dd>${res.name}</dd><dt>Formula</dt><dd>${res.formula}</dd><dt>Mol. weight</dt><dd>${res.mw}${q?' g/mol':''}</dd><dt>SMILES</dt><dd className="mono">${res.smiles}</dd></dl>`}
            <div className="fine">Production renders this with RDKit on the local backend. The prototype uses a fixed drawing.</div>
          </div>
        </section>
      </div>
      <div className="col">${right}</div>
    </div>
    <${Footer}/>
  </div>`;
}

/* ============ app ============ */
function App(){
  let initial='review';
  try{if((location.hash||'').replace('#','')==='explorer')initial='explorer'}catch(e){}
  const [view,setView]=useState(initial);
  return html`<div className="app">
    <${Sidebar} view=${view} setView=${setView}/>
    <div className="main">
      <${Topbar} view=${view}/>
      <div hidden=${view!=='review'}><${ReviewView} goExplorer=${()=>{setView('explorer');window.scrollTo(0,0)}}/></div>
      <div hidden=${view!=='explorer'}><${ExplorerView}/></div>
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>

</body></html>
